[tool.poetry]
name = "hm-feacture-4-hh-vacancies"
version = "0.1.0"
description = ""
authors = ["maks_kras <maksym_krasovskiy@ya.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
black = "^25.12.0"
flake8 = "^7.3.0"
isort = "^7.0.0"
mypy = "^1.19.0"
poetry-core = "^2.2.1"
pytest-cov = "^7.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119

[tool.isort]
line_length = 119
